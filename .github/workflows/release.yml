name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install dependencies
        run: npm ci

      - name: Fetch and verify sidecars
        run: |
          npm run sidecars:fetch
          npm run sidecars:verify

      - name: Fetch corresponding source
        shell: pwsh
        run: ./scripts/fetch-corresponding-sources.ps1 -OutputDirectory "$env:RUNNER_TEMP\release\corresponding-source"

      - name: Prepare mandatory Windows code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD secrets are required for releases"
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\bitig-code-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

      - name: Build signed Windows x64 installer
        env:
          WINDOWS_CERTIFICATE_PATH: ${{ runner.temp }}\bitig-code-signing.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri:build:signed

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "src-tauri\target\release\bundle\nsis" -Filter "BITIG_*_x64-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)" }
          $installer = $installers[0]
          foreach ($path in @("src-tauri\target\release\bitig.exe", $installer.FullName)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $path: $($signature.Status)"
            }
          }

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          $releaseRoot = "$env:RUNNER_TEMP\release"
          $installers = @(Get-ChildItem -LiteralPath "src-tauri\target\release\bundle\nsis" -Filter "BITIG_*_x64-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)" }
          $installer = $installers[0]
          Copy-Item -LiteralPath $installer.FullName -Destination $releaseRoot
          ./scripts/write-release-checksums.ps1 -ArtifactDirectory $releaseRoot

      - name: Publish release assets
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release/BITIG_*_x64-setup.exe
            ${{ runner.temp }}/release/SHA256SUMS.txt
            ${{ runner.temp }}/release/corresponding-source/*
