[package]
name = "bitig"
version = "0.1.5"
description = "A managed desktop media library"
authors = ["BITIG contributors"]
license = "MIT"
repository = "https://github.com/oguzhanozen/BITIG"
homepage = "https://github.com/oguzhanozen/BITIG"
edition = "2024"
rust-version = "1.94"

[lib]
name = "bitig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
async-trait = "=0.1.91"
chrono = { version = "=0.4.45", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["process", "sync", "time", "fs", "io-util", "macros", "rt-multi-thread"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
ureq = "=3.3.0"
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["v7", "serde"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.25.0"
